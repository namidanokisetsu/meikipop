name: reusable macos build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            torch: '2.8.0'
          - runner: macos-15-intel
            arch: x86_64
            torch: '2.2.2'

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2' 'torch==${{ matrix.torch }}' stanza==1.14.0
          pip install -e .
          pip install pyinstaller==6.22.3

      - name: check native bridge and lookup fixtures
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import Vision, Quartz; from meikipop.ocr.macos_vision import recognize; from meikipop.scripts.quick_lookup import main"
          python -m meikipop.scripts.quick_lookup --check-runtime
          python -m unittest discover -s tests -p 'test_macos*.py'
          python -m unittest discover -s tests -p 'test_translation_server.py'
          python -m unittest discover -s tests -p 'test_first_run.py'

      - name: verify native architecture
        run: |
          python -c "import platform; assert platform.machine() == '${{ matrix.arch }}', platform.machine()"

      - name: clean previous builds
        run: rm -rf build dist || true

      - name: build with pyinstaller (macos)
        run: pyinstaller meikipop.macos.spec

      - name: verify app resources and signature
        run: |
          test -f dist/meikipop.app/Contents/Resources/meikipop/scripts/deconjugator.json
          codesign --verify --deep --strict dist/meikipop.app
          # Native imports only: this exits before Qt, capture or accessibility.
          dist/meikipop.app/Contents/MacOS/meikipop --check-runtime

      - name: create dmg
        run: |
          rm -rf dist/dmg-root
          mkdir -p dist/dmg-root
          cp -R dist/meikipop.app dist/dmg-root/
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "meikipop" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            dist/meikipop.macos.${{ matrix.arch }}.dmg
          shasum -a 256 dist/meikipop.macos.${{ matrix.arch }}.dmg > dist/meikipop.macos.${{ matrix.arch }}.dmg.sha256

      - name: upload macos artifact
        uses: actions/upload-artifact@v4
        with:
          name: meikipop-macos-${{ matrix.arch }}
          path: |
            dist/meikipop.macos.${{ matrix.arch }}.dmg
            dist/meikipop.macos.${{ matrix.arch }}.dmg.sha256

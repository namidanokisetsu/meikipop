name: Turkish Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['turkish-v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install Turkish build dependencies
        run: |
          python -m pip install -r packaging/requirements-turkish.txt
          python -m pip install --no-deps -e .
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Build installer
        shell: pwsh
        run: ./Build-Turkish.ps1 -Python (Get-Command python).Source
      - name: Check bundled imports
        run: |
          & ./dist/meikipop-turkish/meikipop-turkish-cli.exe --self-check
          if ($LASTEXITCODE -ne 0) { throw "Bundled import check failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: meikipop-turkish-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sha256

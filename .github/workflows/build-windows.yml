# .github/workflows/build-windows.yml
name: reusable windows build

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "the name of the windows artifact"
        value: ${{ jobs.build-windows.outputs.artifact_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[morphology,turkish-ocr]'
          pip install pyinstaller==6.22.3

      - name: check setup flow
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_first_run.py

      - name: clean previous builds
        run: |
          rmdir build -r -force -ErrorAction SilentlyContinue || true
          rmdir dist -r -force -ErrorAction SilentlyContinue || true

      - name: build Windows installer
        run: ./Build-Windows.ps1 -Python python -ISCC 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'

      - name: verify bundled runtime
        run: |
          & ./dist/Meikipop/Meikipop-cli.exe --check-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Bundled runtime check failed' }

      - name: build windows archive
        run: Compress-Archive -Path dist/Meikipop -DestinationPath dist/meikipop.windows.x64.zip

      - name: upload windows artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: meikipop-windows-x64
          path: |
            dist/*-setup.exe
            dist/*.sha256
            dist/meikipop.windows.x64.zip

name: Desktop input regressions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/input-regressions.yml'

permissions:
  contents: read

jobs:
  shortcuts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install input and settings dependencies
        run: |
          pip install PyQt6 pynput mss requests Pillow platformdirs lxml betterproto protobuf websockets numpy
          pip install --no-deps -e .
      - name: Install macOS native bridges
        if: runner.os == 'macOS'
        run: pip install pynput==1.8.2 pyobjc-framework-Quartz pyobjc-framework-Cocoa pyobjc-framework-Vision
      - name: Check recording, propagation, selection, placement and settings
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import unittest; loader=unittest.defaultTestLoader; suite=unittest.TestSuite(loader.discover('tests', pattern=p) for p in ('test_macos_input.py','test_text_shortcuts.py','test_selection.py','test_scan_gestures.py','test_first_run.py','test_startup.py','test_quick_lookup.py','test_profile_themes.py','test_unified_ocr.py','test_window_focus.py','test_logger.py','test_desktop_access.py','test_single_instance.py','test_popup_placement.py','test_region_selector.py','test_smoothness.py')); result=unittest.TextTestRunner(verbosity=1).run(suite); raise SystemExit(not result.wasSuccessful())"

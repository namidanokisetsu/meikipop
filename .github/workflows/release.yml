# .github/workflows/release.yaml
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yml
  build-macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      require_signing: true
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}

  release:
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Meikipop beta
          generate_release_notes: false
          make_latest: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*/*.dmg
            artifacts/*/*-setup.exe
      - name: remove older app releases, preserving tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name | startswith("v")) | .tag_name' |
          while IFS= read -r tag; do
            if [ "$tag" != "$RELEASE_TAG" ]; then
              gh release delete "$tag" --yes
            fi
          done
